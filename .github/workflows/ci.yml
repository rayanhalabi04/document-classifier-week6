name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: "3.11"

jobs:
  format:
    name: Format check (changed Python files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install format tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==24.4.2 isort==5.13.2

      - name: Find changed backend Python files
        id: changed-python
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi

          {
            echo "files<<EOF"
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'backend/**/*.py' \
              | sed 's#^backend/##'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: black --check
        run: |
          files="${{ steps.changed-python.outputs.files }}"
          if [ -z "$files" ]; then
            echo "No changed backend Python files to check."
            exit 0
          fi

          printf '%s\n' "$files" | xargs black --check

      - name: isort --check-only
        run: |
          files="${{ steps.changed-python.outputs.files }}"
          if [ -z "$files" ]; then
            echo "No changed backend Python files to check."
            exit 0
          fi

          printf '%s\n' "$files" | xargs isort --check-only

  lint:
    name: Lint (changed Python files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8==7.0.0 flake8-bugbear==24.4.26

      - name: Find changed backend Python files
        id: changed-python
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi

          {
            echo "files<<EOF"
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'backend/**/*.py' \
              | sed 's#^backend/##'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: flake8
        run: |
          files="${{ steps.changed-python.outputs.files }}"
          if [ -z "$files" ]; then
            echo "No changed backend Python files to lint."
            exit 0
          fi

          printf '%s\n' "$files" | xargs flake8

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: pytest unit tests
        run: pytest tests/unit -q -o addopts=''

  service-backed:
    name: Service-backed tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: document_classifier
      DATABASE_URL: postgresql://postgres:changeme@localhost:5432/document_classifier

      REDIS_URL: redis://localhost:6379/0

      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_ORIGINALS: originals
      MINIO_BUCKET_OVERLAYS: overlays

      VAULT_ADDR: http://localhost:8200
      VAULT_TOKEN: root

      SFTP_HOST: localhost
      SFTP_PORT: "2222"
      SFTP_USERNAME: vendor
      SFTP_USER: vendor
      SFTP_PASSWORD: vendorpass
      SFTP_DROP_DIR: drop

      JWT_SECRET: ci-jwt-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: Create CI env file for docker compose
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=document_classifier
          DATABASE_URL=postgresql://postgres:changeme@postgres:5432/document_classifier

          REDIS_URL=redis://redis:6379/0

          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET_ORIGINALS=originals
          MINIO_BUCKET_OVERLAYS=overlays

          VAULT_ADDR=http://vault:8200
          VAULT_TOKEN=root

          SFTP_HOST=sftp
          SFTP_PORT=22
          SFTP_USERNAME=vendor
          SFTP_USER=vendor
          SFTP_PASSWORD=vendorpass
          SFTP_DROP_DIR=drop

          JWT_SECRET=ci-jwt-secret
          EOF

      - name: Start service dependencies
        run: |
          docker compose -f ../docker-compose.yml up -d postgres redis minio vault sftp

      - name: Prepare SFTP drop directory
        run: |
          # The Atmoz user is uid/gid 1000; the bind-mounted drop directory
          # must be writable so the live test can upload drop/live_test.tiff.
          docker compose -f ../docker-compose.yml exec -T -u root sftp \
            sh -c 'mkdir -p /home/vendor/drop && chown -R 1000:1000 /home/vendor/drop && chmod 775 /home/vendor/drop'

      - name: Wait for service readiness
        run: |
          timeout 120 bash -c 'until docker compose -f ../docker-compose.yml exec -T postgres pg_isready -U postgres -d document_classifier; do sleep 2; done'
          timeout 120 bash -c 'until docker compose -f ../docker-compose.yml exec -T redis redis-cli ping | grep -q PONG; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:9000/minio/health/live >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:8200/v1/sys/health >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/2222) >/dev/null 2>&1; do sleep 2; done'

      - name: Run database migrations
        run: alembic upgrade head

      - name: Seed CI Vault secrets and authorization policies
        run: |
          python scripts/seed_vault.py --vault-url "$VAULT_ADDR" --vault-token "$VAULT_TOKEN"
          python scripts/seed_casbin_policies.py

      - name: Run service-backed test suites
        run: |
          # Contract tests exercise the FastAPI surface against migrated services.
          # Service tests are included here because they sit outside the T042 unit
          # target; current files are mock-based but still validate service-layer
          # behavior after the service-backed app dependencies are installed.
          # Integration tests cover live Vault, MinIO, and Atmoz SFTP adapters.
          pytest tests/contract tests/service tests/integration -q -o addopts=''

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f ../docker-compose.yml logs postgres redis minio vault sftp

      - name: Stop service dependencies
        if: always()
        run: docker compose -f ../docker-compose.yml down -v

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: mypy
        run: mypy app/

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"
          python -m pip install pip-audit

      - name: pip-audit
        run: |
          # torch / torchvision +cpu wheels live on the PyTorch index, not PyPI
          # and are reported as "skipped" by pip-audit. Audit the current env in
          # JSON mode and fail the job only on real vulnerabilities, not skips.
          pip-audit --format json > /tmp/audit.json || true
          python -c "
          import json, sys
          data = json.load(open('/tmp/audit.json'))
          vulnerable = [d for d in data.get('dependencies', []) if d.get('vulns')]
          if vulnerable:
              print(f'Found vulnerabilities in {len(vulnerable)} packages:')
              for d in vulnerable:
                  print(f\"  {d['name']} {d.get('version','')}: {len(d['vulns'])} vulns\")
              sys.exit(1)
          print('No vulnerabilities found in audited packages.')
          "

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
