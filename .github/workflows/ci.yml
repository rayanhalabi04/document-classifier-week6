name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    working-directory: backend

jobs:
  format:
    name: Format check (black + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: black --check
        run: black --check app/ tests/

      - name: isort --check-only
        run: isort --check-only app/ tests/

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: flake8
        run: flake8 app/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: mypy
        run: mypy app/

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: pytest unit tests
        run: pytest tests/unit/ -v

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: pip-audit
        run: pip install pip-audit && pip-audit

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    needs: dependency-audit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
