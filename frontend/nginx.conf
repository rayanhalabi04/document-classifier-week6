server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy — all backend calls go to the api container
    location /auth/    { proxy_pass http://api:8000; }
    location /users/   { proxy_pass http://api:8000; }
    location /batches/ { proxy_pass http://api:8000; }
    location /predictions/ { proxy_pass http://api:8000; }
    location /audit-events/ { proxy_pass http://api:8000; }
    location /roles/ { proxy_pass http://api:8000; }
    location /health/  { proxy_pass http://api:8000; }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
